<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จัดเวรพยาบาล หอผู้ป่วยใน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EDF1F5;--surface:#FFFFFF;--surface2:#F5F7FA;--ink:#16233A;--muted:#5A6678;--line:#D4DBE4;
  --accent:#0F5C8C;--accent-ink:#FFFFFF;--accent-soft:#DDEBF5;
  --warn:#B42318;--warn-bg:#FDECEA;--ok:#1D7A46;--okbg:#E2F3E8;
  --M:#AD6800;--A:#0B7675;--N:#3F3A8F;
  --holbg:#FCEDEE;--holink:#C0262D;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151E;--surface:#17202C;--surface2:#1C2633;--ink:#E4EAF2;--muted:#9AA7B8;--line:#2C3847;
  --accent:#5AA8DA;--accent-ink:#0B1520;--accent-soft:#1A3045;
  --warn:#F2877C;--warn-bg:#3A1C1A;--ok:#6FCF97;--okbg:#173022;
  --M:#E9A93E;--A:#4CC3C1;--N:#A49EF0;--holbg:#2E1D22;--holink:#F28B90;
}}
:root[data-theme="dark"]{
  --bg:#0F151E;--surface:#17202C;--surface2:#1C2633;--ink:#E4EAF2;--muted:#9AA7B8;--line:#2C3847;
  --accent:#5AA8DA;--accent-ink:#0B1520;--accent-soft:#1A3045;
  --warn:#F2877C;--warn-bg:#3A1C1A;--ok:#6FCF97;--okbg:#173022;
  --M:#E9A93E;--A:#4CC3C1;--N:#A49EF0;--holbg:#2E1D22;--holink:#F28B90;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:16px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
@media (max-width:960px){.app{grid-template-columns:1fr}}
aside{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
@media (max-width:960px){aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}}
.brand{font-weight:700;font-size:1.25rem;line-height:1.25;margin-bottom:2px}
.brand-sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
.month{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px;background:var(--surface2)}
.month b{font-weight:600}
.month button{border:0;background:transparent;width:34px;height:34px;border-radius:8px;font-size:1.15rem}
.month button:hover{background:var(--surface)}
.steps{display:flex;flex-direction:column;gap:2px;counter-reset:st}
@media (max-width:960px){.steps{flex-direction:row;overflow-x:auto}}
.steps button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px;color:var(--muted);white-space:nowrap}
.steps button:hover{background:var(--surface2)}
.steps button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.steps i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;font-size:.8rem;flex:none}
.steps button.on i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.side-note{margin-top:22px;font-size:.82rem;color:var(--muted)}
@media (max-width:960px){.side-note{margin-top:10px}}
main{padding:24px 26px 70px;min-width:0}
@media (max-width:960px){main{padding:16px 12px 60px}}
h2.pg{font-size:1.45rem;margin:0 0 4px;font-weight:700}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:10px 14px;margin-top:16px}
.savebar[hidden]{display:none}
.savebar b{margin-right:auto}
.steps .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:auto}
.bk{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.bk .btn{font-size:.85rem;text-align:center;cursor:pointer}
@media (max-width:960px){.bk{flex-direction:row;flex-wrap:wrap}}
.btn.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.muted{color:var(--muted)}.small{font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h3{font-size:1.08rem;margin:0 0 10px;font-weight:600}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 12px;font-size:.92rem}
.stats b{font-weight:700}
.stats .bad{color:var(--warn)}.stats .good{color:var(--ok)}
/* person grid */
table.g{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.g th,table.g td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center}
table.g thead th{background:var(--surface2);position:sticky;top:0;z-index:2;padding:4px 2px;font-weight:500}
table.g thead th.hol{background:var(--holbg);color:var(--holink)}
table.g .dn{display:block;font-weight:700;font-size:13px}
table.g .dw{display:block;font-size:11px}
table.g .nm{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:5px 10px;min-width:178px;white-space:nowrap;font-weight:500}
table.g thead .nm{z-index:3;background:var(--surface2)}
table.g .nm small{display:block;color:var(--muted);font-weight:400;font-size:11px}
td.c{min-width:36px;height:46px;position:relative;cursor:pointer;background:var(--surface)}
td.c.hol{background:var(--holbg)}
td.c:hover{box-shadow:inset 0 0 0 2px var(--accent)}
td.c.bad{box-shadow:inset 0 0 0 2px var(--warn)}
td.c .stk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0}
td.c .lk{position:absolute;left:2px;top:1px;font-size:9px;color:var(--muted)}
td.c.ro::after,td.c.rw::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 9px 9px 0}
td.c.ro::after{border-color:transparent var(--warn) transparent transparent}
td.c.rw::after{border-color:transparent var(--ok) transparent transparent}
.k{display:inline-block;min-width:20px;height:18px;line-height:16px;border-radius:5px;font-weight:700;font-size:12px;text-align:center;padding:0 3px;border:1.5px solid transparent}
.k.r.M{background:var(--M);color:#fff}.k.r.A{background:var(--A);color:#fff}.k.r.N{background:var(--N);color:#fff}
:root[data-theme="dark"] .k.r{color:#0B1520}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .k.r{color:#0B1520}}
.k.s{background:transparent;border-style:dashed}
.k.ot{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--ink)}
td.tc{font-weight:600;padding:0 7px;background:var(--surface2);font-size:13px;white-space:nowrap}
td.tc.ot{font-weight:700;font-size:14px}
td.tc.lo{color:var(--warn)}
table.g thead th.tc{font-size:11px;line-height:1.25;padding:4px 5px;white-space:nowrap}
.sync{display:flex;gap:7px;align-items:flex-start}
.sync i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--muted)}
.sync.ok i{background:var(--ok)}.sync.bad i{background:var(--warn)}
.k.s.M{color:var(--M);border-color:var(--M)}.k.s.A{color:var(--A);border-color:var(--A)}.k.s.N{color:var(--N);border-color:var(--N)}
td.tot{font-weight:700;padding:0 8px;background:var(--surface2)}
tr.cov th.nm{font-weight:400;font-size:12px;background:var(--surface2)}
tr.cov td{font-size:11px;padding:3px 1px;background:var(--surface2);line-height:1.3}
tr.cov td.short{background:var(--warn-bg);color:var(--warn);font-weight:700}
tr.cov.first>*{border-top:2px solid var(--line)}
/* day view */
table.dv{border-collapse:collapse;width:100%;font-size:14px}
table.dv th,table.dv td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.dv thead th{background:var(--surface2);font-weight:600;position:sticky;top:0}
table.dv td.d{white-space:nowrap;font-weight:600;width:96px}
table.dv tr.hol td.d{color:var(--holink)}
table.dv tr.hol{background:var(--holbg)}
.nmchip{display:inline-block;margin:1px 6px 1px 0}
.nmchip.sb{color:var(--muted)}
.nmchip.sb::before{content:"SB ";font-size:11px;font-weight:700}
.short-tag{color:var(--warn);font-weight:700;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.85rem;color:var(--muted);margin:10px 2px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.issues li{margin:3px 0}.issues .err{color:var(--warn)}
.okmsg{color:var(--ok);font-weight:600}
/* summary */
table.sum{border-collapse:collapse;width:100%;font-size:14px}
table.sum th,table.sum td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:right;white-space:nowrap}
table.sum th:first-child,table.sum td:first-child{text-align:left}
table.sum thead th{background:var(--surface2);font-weight:600;font-size:13px}
table.sum thead tr.grp th{text-align:center;border-bottom:0}
table.sum td.b{font-weight:700}
table.sum td.z{color:var(--muted)}
table.sum tfoot td{font-weight:700;background:var(--surface2)}
.sp{display:block;font-size:11px;color:var(--muted);font-weight:400}
/* requests */
.rq{display:grid;grid-template-columns:230px 1fr;gap:16px}
@media (max-width:760px){.rq{grid-template-columns:1fr}}
.nl{display:flex;flex-direction:column;gap:4px}
@media (max-width:760px){.nl{flex-direction:row;flex-wrap:wrap}}
.nl button{text-align:left;border:1px solid var(--line);background:var(--surface);padding:7px 10px;border-radius:8px}
.nl button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.nl .cnt{display:block;font-size:12px;color:var(--muted);font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wh{font-size:12px;color:var(--muted);text-align:center}
.cal .wh.we{color:var(--holink)}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;min-height:72px}
.cd.hol{background:var(--holbg)}
.cd.hol .cdn{color:var(--holink)}
.cdn{border:0;background:none;font-weight:700;padding:0 4px;border-radius:5px;font-size:13px}
.cb{display:flex;gap:3px;margin-top:4px}
.rb{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 0;font-size:12px;font-weight:700}
.rb.v1{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.rb.v2{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);text-decoration:line-through}
/* nurses */
details.nc{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
details.nc>summary{cursor:pointer;padding:11px 16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;list-style:none}
details.nc>summary::-webkit-details-marker{display:none}
details.nc[open]>summary{border-bottom:1px solid var(--line)}
.ncb{padding:14px 16px}
.f{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:12px}
.f label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.f input,.f select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:15px;min-width:90px}
.f input.w{min-width:230px}
table.al{border-collapse:collapse;font-size:13px}
table.al th,table.al td{border:1px solid var(--line);padding:4px 6px}
table.al th{font-weight:500;background:var(--surface2);text-align:left}
table.al thead th{text-align:center}
.tg{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:12px;margin:1px;color:var(--muted)}
.tg.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tg.sb.on{background:var(--accent-soft);color:var(--accent);border-style:dashed;border-color:var(--accent)}
.note{font-size:.86rem;color:var(--muted);margin:6px 0 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
table.st{border-collapse:collapse;font-size:15px}
table.st th,table.st td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:center}
table.st th:first-child{text-align:left}
table.st input{width:60px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;text-align:center}
.chk{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:.93rem}
.chk input{margin-top:5px}
.grp{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--surface2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.hc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:420px}
.hc button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;font-size:14px}
.hc button.on{background:var(--holbg);border-color:var(--holink);color:var(--holink);font-weight:700}
.hc .wh{font-size:12px;color:var(--muted);text-align:center}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(10,18,30,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--surface);border-radius:14px;padding:18px;width:min(430px,100%);border:1px solid var(--line)}
.mbox h3{margin:0;font-size:1.1rem}
.srow{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin:10px 0}
.srow .seg{display:flex}.srow .seg button{flex:1;padding:7px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;z-index:60;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}}}
.prog{font-size:.9rem;color:var(--muted)}
.empty{padding:30px;text-align:center}
.empty p{max-width:56ch;margin:8px auto 18px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">จัดเวรพยาบาล<br>หอผู้ป่วยใน</div>
    <div class="brand-sub" id="bsub"></div>
    <div class="month"><button data-act="mprev" aria-label="เดือนก่อน">‹</button><b id="mlabel"></b><button data-act="mnext" aria-label="เดือนถัดไป">›</button></div>
    <nav class="steps" id="steps"></nav>
    <div class="side-note sync" id="sync"><i></i><span>บันทึกไว้ในเบราว์เซอร์เครื่องนี้</span></div>
    <div class="side-note bk"><button class="btn ghost" data-act="backup">สำรองข้อมูล (.json)</button><label class="btn ghost">นำเข้าข้อมูลสำรอง<input type="file" id="restore" accept=".json,application/json" hidden></label></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal"></div><div id="toast"></div>
<script>
/* ================= constants ================= */
const SH=['N','M','A'],SHN={N:'ดึก',M:'เช้า',A:'บ่าย'},SHC={N:'ด',M:'ช',A:'บ'};
const ROWS=['1','2','3','4','5','6','0','ph'];
const ROWN={'1':'จันทร์','2':'อังคาร','3':'พุธ','4':'พฤหัสบดี','5':'ศุกร์','6':'เสาร์','0':'อาทิตย์','ph':'นักขัตฤกษ์ (จ–ศ)'};
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'],DOWF=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const MON=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const FIXED_HOL=['01-01','04-06','04-13','04-14','04-15','05-01','06-03','07-28','08-12','10-13','10-23','12-05','12-10','12-31'];
const LS='ipd-roster-v3';
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WDR=r=>['1','2','3','4','5'].includes(r);
const sum=a=>{let t=0;for(const v of a)t+=v;return t};

/* ================= defaults & storage ================= */
function mkAllow(fn){const a={};ROWS.forEach(r=>{a[r]={};SH.forEach(s=>{a[r][s]=fn(r,s).map(Boolean)})});return a}
function defaults(){
  const t=new Date();let y=t.getFullYear(),m=t.getMonth()+1;if(m>11){m=0;y++}
  const run=(id,name)=>({id,name,nick:'',mode:'quota',quota:20,maxShifts:0,maxReg:0,maxSb:0,maxNight:0,allow:mkAllow(()=>[1,1])});
  return {v:3,year:y,month:m,
    nurses:[
      {id:'n1',name:'พนารัตน์ เจดีย์กอง',nick:'',mode:'fixed',quota:0,maxShifts:0,maxReg:6,maxSb:0,maxNight:0,allow:mkAllow((r,s)=>WDR(r)&&s!=='N'?[1,0]:[0,0])},
      {id:'n2',name:'หนึ่งนุช เชนยวนิช',nick:'',mode:'ot',quota:0,maxShifts:0,maxReg:6,maxSb:0,maxNight:0,allow:mkAllow((r,s)=>(r==='1'||r==='4')&&s==='A'?[1,0]:(r==='2'||r==='5')&&s==='N'?[0,1]:[0,0])},
      {id:'n3',name:'สุดาทิพย์ กรรเชียง',nick:'',mode:'fixed',quota:0,maxShifts:0,maxReg:0,maxSb:0,maxNight:0,allow:mkAllow((r,s)=>WDR(r)&&s==='M'?[1,0]:((r==='5'&&s==='A')||(r==='6'&&s==='N'))?[1,1]:[0,0])},
      {id:'n4',name:'สุนิตย์ แซ่เติน',nick:'',mode:'ot',quota:0,maxShifts:0,maxReg:12,maxSb:3,maxNight:3,allow:mkAllow((r,s)=>WDR(r)&&s!=='M'?[1,1]:[0,0])},
      run('n5','ศิริพร ภูลังกา'),run('n6','เมธินี กำธรนิมิตร'),run('n7','ชัญญานุช มีคำ'),run('n8','อชิรญา เสารางทอย'),run('n9','นุชนาฏ ปันปั๋น'),
      {id:'n10',name:'ณัฐรดา พิษสมอญ',nick:'',mode:'quota',quota:12,maxShifts:0,maxReg:0,maxSb:0,maxNight:0,allow:mkAllow((r,s)=>(r==='1'||r==='2')&&s==='M'?[0,0]:[1,1])},

function prep(c){

  let uR=0,uS=0,over=0,obj=0,unmet=0;
  for(let idx=0;idx<L;idx++){let r=0,s=0;for(let i=0;i<n;i++){const v=A[i][idx];if(v===1&&regCounts[i][idx])r++;else if(v===2)s++}
    if(r<needR[idx])uR+=needR[idx]-r;else over+=r-needR[idx];if(s<needS[idx])uS+=needS[idx]-s;else over+=s-needS[idx]}
  obj+=uR*1e5+uS*2e4+over*5e3;
  const nightQ=[],holQ=[];
  P.forEach((p,i)=>{
    let reg=0,sb=0,night=0,hol=0,dbl=0;const Ai=A[i];
    for(let idx=0;idx<L;idx++){const v=Ai[idx];if(!v)continue;if(v===1&&!p.fixed[idx])reg++;if(v===2)sb++;if(idx%3===0)night++;if(c.days[(idx/3)|0].hol)hol++}
    for(let d=0;d<c.D;d++){let k=0;for(let q=0;q<3;q++)if(Ai[d*3+q])k++;if(k>=2)dbl++}
    p.want.forEach(idx=>{if(!Ai[idx]){obj+=2000;unmet++}});
    obj+=30*(reg-tR[i])**2+15*(sb-tS[i])**2+3*dbl;
    const q=reg+(S.rules.sbInQuota?sb:0);if(q<p.base)obj+=800*(p.base-q);
    if(p.n.mode==='quota'){nightQ.push(night);holQ.push(hol)}
  });
  const vr=a=>{if(!a.length)return 0;const m=sum(a)/a.length;return sum(a.map(x=>(x-m)**2))};
  obj+=10*vr(nightQ)+5*vr(holQ);
  return {obj,uR,uS,unmet};
}
/* local search: move single assignments between nurses */
function improve(X,A,iters){
  const {c,P}=X,L=c.L,n=P.length;let cur=evalA(X,A).obj;
  for(let it=0;it<iters;it++){
    const idx=(Math.random()*L)|0;
    // pick a mover: either an existing assignee (move) or an empty spot (fill)
    const holders=[];for(let i=0;i<n;i++){const v=A[i][idx];if(v&&!P[i].locked[idx]&&!(v===1&&P[i].fixed[idx]))holders.push(i)}
    const fill=Math.random()<.25;
    let j=-1,t;
    if(fill||!holders.length){t=Math.random()<.6?1:2}else{j=holders[(Math.random()*holders.length)|0];t=A[j][idx]}
    const cands=[];for(let i=0;i<n;i++){if(i===j)continue;cands.push(i)}
    const i=cands[(Math.random()*cands.length)|0];
    if(j>=0)A[j][idx]=0;
    const st=rowStats(X,A,i);
    if(!canPut(X,A,i,idx,t,st.nf,st.nights,st.nr,st.ns)){if(j>=0)A[j][idx]=t;continue}
    A[i][idx]=t;
    const nv=evalA(X,A).obj;
    if(nv<=cur){cur=nv}else{A[i][idx]=0;if(j>=0)A[j][idx]=t}
  }
  return cur;
}
async function generate(){
  if(busy)return;busy=true;
  const c=ctx(),X=prep(c),E=[[80,1500],[180,4000],[350,9000]][(+S.rules.effort||2)-1]||[180,4000];
  const pg=m=>{const el=document.getElementById('prog');if(el)el.textContent=m};
  let best=null,bo=Infinity;
  for(let it=0;it<E[0];it++){
    const A=greedy(X,10),o=evalA(X,A).obj;if(o<bo){bo=o;best=A}
    if(it%12===0){pg(`กำลังลองจัด ${it+1}/${E[0]} แบบ…`);await new Promise(r=>setTimeout(r,0))}
  }
  const chunk=500;
  for(let k=0;k<E[1];k+=chunk){improve(X,best,chunk);pg(`กำลังปรับให้สมดุล ${Math.min(100,Math.round((k+chunk)/E[1]*100))}%`);await new Promise(r=>setTimeout(r,0))}
  const ev=evalA(X,best);
  const a={};S.nurses.forEach((n,i)=>a[n.id]=Array.from(best[i]));
  S.rosters[c.mk]={a,at:Date.now()};save();busy=false;render();
  toast(ev.uR||ev.uS?`จัดเสร็จ แต่ยังขาด: เวรปกติ ${ev.uR} / standby ${ev.uS} — ดูรายละเอียดใต้ตาราง`:'จัดตารางเสร็จ ครบทุกเวร');
}
function getA(c){const R=S.rosters[c.mk];if(!R)return null;return S.nurses.map(n=>R.a[n.id]&&R.a[n.id].length===c.L?Uint8Array.from(R.a[n.id]):new Uint8Array(c.L))}

/* ================= checks & summary ================= */
function validate(c,A){
  const issues=[],cell={},cov=[],maxC=+S.rules.maxConsec||3,nma=!!S.rules.forbidNMA,prev=prevTail(c);
  const mark=(i,idx,m)=>{(cell[i+':'+idx]=cell[i+':'+idx]||[]).push(m)};
  const idI={};S.nurses.forEach((n,i)=>idI[n.id]=i);
  const dt=d=>`${d} ${MON[c.m].slice(0,3)}.`;
  c.days.forEach((day,di)=>SH.forEach((s,si)=>{
    const idx=di*3+si;let r=0,sb=0;
    S.nurses.forEach((n,i)=>{const v=A[i][idx];if(v===1&&countsReg(n,day,s))r++;if(v===2)sb++});
    const nr=day.need[s].r,ns=day.need[s].s;cov[idx]={r,sb,nr,ns};
    if(r<nr)issues.push({e:1,t:`${dt(day.d)} เวร${SHN[s]}: ขาดเวรปกติ ${nr-r} คน`});
    if(sb<ns)issues.push({e:1,t:`${dt(day.d)} เวร${SHN[s]}: ขาด standby ${ns-sb} คน`});
    if(r>nr)issues.push({e:0,t:`${dt(day.d)} เวร${SHN[s]}: เวรปกติเกิน ${r-nr} คน`});
    if(sb>ns)issues.push({e:0,t:`${dt(day.d)} เวร${SHN[s]}: standby เกิน ${sb-ns} คน`});
    S.groups.forEach(g=>{if(!g.shifts.includes(s))return;const on=g.members.map(id=>idI[id]).filter(i=>i!=null&&(g.sb?A[i][idx]>0:A[i][idx]===1));
      if(on.length>1)on.forEach(i=>mark(i,idx,'อยู่เวรเดียวกับคนในกลุ่มที่ห้ามอยู่ด้วยกัน'))});
  }));
  S.nurses.forEach((n,i)=>{
    const Ai=A[i];let nf=0,nights=0,reg=0,sb=0,unmet=0,regNF=0;
    c.days.forEach((day,di)=>SH.forEach((s,si)=>{
      const idx=di*3+si,v=Ai[idx],rq=req(c,n.id,day.d,s);
      if(rq===1&&!v)unmet++;
      if(!v)return;
      const fx=v===1&&isFixedSlot(n,day,s);
      if(!fx){nf++;if(v===1)regNF++}if(si===0)nights++;if(v===1)reg++;else sb++;
      if(rq===2)mark(i,idx,`ขึ้นเวร${SHN[s]}ในวันที่ขอไม่ขึ้น`);
      const al=n.allow[day.row][s];
      if((v===1&&!al[0])||(v===2&&!al[1]))mark(i,idx,`เงื่อนไขไม่ให้ขึ้น${v===2?' standby ':''}เวร${SHN[s]}วันนี้`);
      if(v===1&&!runOK(Ai,idx,maxC,nma,prev[i]))mark(i,idx,`เวรปกติติดกันเกิน ${maxC} เวร หรือเป็นดึก-เช้า-บ่าย`);
    }));
    if(+n.maxShifts>0&&nf>+n.maxShifts)issues.push({e:1,t:`${n.name}: ${nf} เวร เกินที่กำหนด ${n.maxShifts} เวร`});
    if(+n.maxReg>0&&regNF>+n.maxReg)issues.push({e:1,t:`${n.name}: เวรปกติ ${regNF} เวร เกินที่กำหนด ${n.maxReg} เวร`});
    if(+n.maxSb>0&&sb>+n.maxSb)issues.push({e:1,t:`${n.name}: standby ${sb} เวร เกินที่กำหนด ${n.maxSb} เวร`});
    if(+n.maxNight>0&&nights>+n.maxNight)issues.push({e:1,t:`${n.name}: เวรดึก ${nights} เวร เกินที่กำหนด ${n.maxNight} เวร`});
    const q=reg+(S.rules.sbInQuota?sb:0);
    if(n.mode==='quota'&&q<+n.quota)issues.push({e:1,t:`${n.name}: นับเวรได้ ${q} เวร ยังไม่ถึงโควตา ${n.quota} เวร`});
    if(unmet)issues.push({e:0,t:`${n.name}: คำขอขึ้นเวรที่ยังไม่ได้ ${unmet} เวร`});
  });
  Object.entries(cell).forEach(([k,m])=>{const [i,idx]=k.split(':').map(Number);const day=c.days[(idx/3)|0];
    issues.push({e:1,t:`${S.nurses[i].name} ${dt(day.d)}: ${[...new Set(m)].join(', ')}`})});
  return {issues,cell,cov};
}
function classify(c,A,i){
  const n=S.nurses[i],list=[];
  c.days.forEach((day,di)=>SH.forEach((s,si)=>{const v=A[i][di*3+si];if(v)list.push({di,day,s,v,hol:day.hol,fixed:v===1&&isFixedSlot(n,day,s),wdM:!day.hol&&s==='M'})}));
  list.forEach(x=>x.lab=x.v===2?'SB':'OT');
  if(n.mode==='fixed')list.forEach(x=>{if(x.fixed)x.lab='WORK'});
  else if(n.mode==='quota'){
    let pool=list.filter(x=>x.v===1||(S.rules.sbInQuota&&x.v===2));
    if(S.rules.quotaOrder==='wdM')pool=[...pool.filter(x=>x.wdM&&x.v===1),...pool.filter(x=>!(x.wdM&&x.v===1))];
    pool.slice(0,+n.quota||0).forEach(x=>x.lab='WORK');
  }
  return list;
}
function summarize(c,A){
  return S.nurses.map((n,i)=>{
    const o={n,total:0,nights:0,work:0,ot:{N:[0,0],M:[0,0],A:[0,0]},sb:{N:[0,0],M:[0,0],A:[0,0]}};
    classify(c,A,i).forEach(x=>{o.total++;if(x.s==='N')o.nights++;
      if(x.lab==='WORK')o.work++;else if(x.lab==='OT')o.ot[x.s][x.hol?1:0]++;else o.sb[x.s][x.hol?1:0]++});
    o.otT=SH.reduce((t,s)=>t+o.ot[s][0]+o.ot[s][1],0);o.sbT=SH.reduce((t,s)=>t+o.sb[s][0]+o.sb[s][1],0);
    return o;
  });
}

  try{const b=data instanceof Blob?data:new Blob([data],{type:mime||'text/html'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
  catch(e){toast('เบราว์เซอร์นี้ไม่อนุญาตให้บันทึกไฟล์ ลองเปิดผ่านลิงก์ claude.ai')}
}

  const w3=XLSX.utils.aoa_to_sheet(a3);w3['!cols']=[{wch:6},{wch:24},{wch:30},...Array(17).fill({wch:10})];
  XLSX.utils.book_append_sheet(wb,w3,'สรุป OT');
  const a4=[['วันที่','วัน','วันหยุด','เวร','ประเภท','พยาบาล','การนับ']];const rows=[];
  S.nurses.forEach((n,i)=>classify(c,A,i).forEach(x=>rows.push([x.di,SH.indexOf(x.s),[`${x.day.d}/${c.m+1}/${c.y+543}`,DOW[x.day.dow],x.hol?'หยุด':'',SHN[x.s],x.v===1?'ปกติ':'Standby',n.name,x.lab==='WORK'?'เวรปกติ/วันทำการ':x.lab==='OT'?'OT':'Standby']])));
  rows.sort((p,q)=>p[0]-q[0]||p[1]-q[1]).forEach(r=>a4.push(r[2]));
  const w4=XLSX.utils.aoa_to_sheet(a4);w4['!cols']=[{wch:12},{wch:5},{wch:7},{wch:6},{wch:9},{wch:24},{wch:16}];
  XLSX.utils.book_append_sheet(wb,w4,'รายการเวร');
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  saveFile(`ตารางเวร_IPD_${c.mk}.xlsx`,new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
function exportPrint(){
  const c=ctx(),A=getA(c);if(!A){toast('ยังไม่มีตารางเวรเดือนนี้');return}const R=summarize(c,A);
  const col={N:'#3F3A8F',M:'#AD6800',A:'#0B7675'};
  const LM=labMaps(c,A);const cell=(Ai,di,i)=>SH.map((s,si)=>{const v=Ai[di*3+si];return v===1?`<b style="color:${col[s]}${LM[i][di*3+si]==='OT'?';border:1.5px solid #111;padding:0 2px':''}">${SHC[s]}</b>`:v===2?`<span style="color:${col[s]};border:1px dashed ${col[s]};padding:0 2px">${SHC[s]}</span>`:''}).filter(Boolean).join('<br>');
  const names=(idx,t)=>S.nurses.map((n,i)=>A[i][idx]===t?esc(shortName(n)):'').filter(Boolean).join(', ');
  const h=`<!doctype html><html lang="th"><head><meta charset="utf-8"><title>ตารางเวร ${MON[c.m]} ${c.y+543}</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:"Sarabun","TH SarabunPSK","Noto Sans Thai",Tahoma,sans-serif;font-size:11px;color:#111}h1{font-size:16px;margin:0 0 6px}h2{font-size:13px;margin:14px 0 4px}table{border-collapse:collapse;width:100%;margin-bottom:10px}th,td{border:1px solid #999;padding:2px 3px;text-align:center}.n{text-align:left;white-space:nowrap}.h{background:#fbe3e4}.pb{page-break-before:always}.sg{margin-top:30px;display:flex;justify-content:space-around}</style></head><body>
  <h1>ตารางเวรพยาบาล หอผู้ป่วยใน ประจำเดือน${MON[c.m]} ${c.y+543}</h1>
  <table><tr><th class="n">พยาบาล</th>${c.days.map(d=>`<th class="${d.hol?'h':''}">${d.d}<br>${DOW[d.dow]}</th>`).join('')}<th>ปกติ</th><th>OT</th><th>SB</th><th>รวม</th></tr>
  ${S.nurses.map((n,i)=>`<tr><td class="n">${i+1}. ${esc(n.name)}</td>${c.days.map((d,di)=>`<td class="${d.hol?'h':''}">${cell(A[i],di,i)}</td>`).join('')}<td>${workLabel(R[i])}</td><td><b>${R[i].otT}</b></td><td>${R[i].sbT}</td><td>${R[i].total}</td></tr>`).join('')}</table>
  <div>ด = ดึก ช = เช้า บ = บ่าย ตัวในกรอบทึบ = เวรปกติที่นับเป็น OT ตัวในกรอบเส้นประ = standby ช่องสีชมพู = วันหยุด</div>
  <div class="sg"><span>ผู้จัดตารางเวร ..............................</span><span>หัวหน้าหอผู้ป่วย ..............................</span><span>ผู้อนุมัติ ..............................</span></div>
  <h2 class="pb">ตารางเวรรายวัน</h2><table><tr><th>วันที่</th><th>เช้า</th><th>บ่าย</th><th>ดึก</th><th>Standby</th></tr>
  ${c.days.map((d,di)=>`<tr class="${d.hol?'h':''}"><td class="n">${DOW[d.dow]} ${d.d}</td><td class="n">${names(di*3+1,1)}</td><td class="n">${names(di*3+2,1)}</td><td class="n">${names(di*3,1)}</td><td class="n">${[['ช',di*3+1],['บ',di*3+2],['ด',di*3]].map(([l,ix])=>{const x=names(ix,2);return x?l+': '+x:''}).filter(Boolean).join(' / ')}</td></tr>`).join('')}</table>
  <h2>สรุปเวรและ OT</h2><table><tr><th class="n">พยาบาล</th><th>รวม</th><th>ปกติ/ทำการ</th><th>OT ช</th><th>OT บ</th><th>OT ด</th><th>รวม OT</th><th>SB ช</th><th>SB บ</th><th>SB ด</th><th>รวม SB</th></tr>
  ${R.map((o,i)=>`<tr><td class="n">${i+1}. ${esc(o.n.name)}</td><td>${o.total}</td><td>${o.work}</td>${['M','A','N'].map(s=>`<td>${o.ot[s][0]+o.ot[s][1]}</td>`).join('')}<td><b>${o.otT}</b></td>${['M','A','N'].map(s=>`<td>${o.sb[s][0]+o.sb[s][1]}</td>`).join('')}<td><b>${o.sbT}</b></td></tr>`).join('')}</table>
  </body></html>`;
  saveFile(`ตารางเวร_IPD_${c.mk}_พิมพ์.html`,h,'text/html');
}

/* ================= events ================= */
const D=()=>draft||(draft=JSON.parse(JSON.stringify(S.nurses)));
function setField(t){const n=D().find(x=>x.id===t.dataset.id),f=t.dataset.f;if(!n)return;n[f]=['quota','maxShifts','maxReg','maxSb','maxNight'].includes(f)?(+t.value||0):t.value}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.f&&t.tagName==='INPUT'){setField(t);const b=document.getElementById('nbar');if(b)b.hidden=false}});
async function saveNurses(){
  if(!draft&&!(BK&&!dbRO)){toast('ไม่มีการแก้ไขที่ต้องบันทึก');return}
  if(draft){const ids=new Set(draft.map(n=>n.id));
  S.nurses=draft;draft=null;S.groups.forEach(g=>g.members=g.members.filter(id=>ids.has(id)));}
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  render();
  if(BK&&!dbRO){clearTimeout(syncT);setSync('saving');const ok=await syncNow();toast(ok?'บันทึกแล้ว เปิดใหม่จะใช้ค่าล่าสุดนี้':'บันทึกในเครื่องนี้แล้ว แต่บันทึกขึ้นเซิร์ฟเวอร์ไม่สำเร็จ ลองกดบันทึกอีกครั้ง')}
  else toast(dbRO?'โหมดดูอย่างเดียว บันทึกขึ้นเซิร์ฟเวอร์ไม่ได้':'บันทึกในเบราว์เซอร์เครื่องนี้แล้ว');
}
let pendingYes=null;
function ask(msg,yes,fn){pendingYes=fn;document.getElementById('modal').innerHTML=`<div class="modal" data-act="mclose"><div class="mbox" role="alertdialog" aria-modal="true"><h3>${esc(msg)}</h3><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-act="mclose2">ยกเลิก</button><button class="btn danger" data-act="yes">${esc(yes)}</button></div></div></div>`}
function lockDay(c,i,di,A){const L=S.locks[c.mk]=S.locks[c.mk]||{},nid=S.nurses[i].id,o=L[nid]=L[nid]||{};SH.forEach((s,si)=>o[di*3+si]=A[i][di*3+si])}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,c=ctx();
  if(a==='mclose'&&e.target!==t)return;
  switch(a){
    case 'page':page=t.dataset.k;window.scrollTo(0,0);break;
    case 'view':view=t.dataset.v;break;
    case 'mprev':S.month--;if(S.month<0){S.month=11;S.year--}save();break;
    case 'mnext':S.month++;if(S.month>11){S.month=0;S.year++}save();break;
    case 'gen':generate();return;
    case 'clear':ask('ลบตารางเวรและการล็อกของเดือนนี้?','ลบตาราง',()=>{delete S.rosters[c.mk];delete S.locks[c.mk];save()});return;
    case 'yes':{const f=pendingYes;pendingYes=null;document.getElementById('modal').innerHTML='';if(f)f();render();return}
    case 'unlock':delete S.locks[c.mk];save();break;
    case 'xlsx':exportXlsx();return;
    case 'print':exportPrint();return;
    case 'cell':openCell(+t.dataset.i,+t.dataset.di);return;
    case 'setc':{const i=+t.dataset.i,di=+t.dataset.di,A=getA(c);A[i][di*3+ +t.dataset.si]=+t.dataset.v;setA(c,A);lockDay(c,i,di,A);save();render();openCell(i,di);return}
    case 'unlockday':{const i=+t.dataset.i,di=+t.dataset.di,o=S.locks[c.mk]?.[S.nurses[i].id];if(o)SH.forEach((s,si)=>delete o[di*3+si]);save();render();openCell(i,di);return}
    case 'mclose':case 'mclose2':document.getElementById('modal').innerHTML='';return;
    case 'reqn':reqNurse=t.dataset.id;break;
    case 'reqs':case 'reqday':{const R=S.requests[c.mk]=S.requests[c.mk]||{},P=R[reqNurse]=R[reqNurse]||{},d=t.dataset.d,D=P[d]=P[d]||{};
      if(a==='reqs'){const s=t.dataset.s,v=D[s]||0;D[s]=v===0?2:v===2?1:0}else{const allOff=SH.every(s=>D[s]===2);SH.forEach(s=>D[s]=allOff?0:2)}
      save();break}
    case 'reqclear':if(S.requests[c.mk])delete S.requests[c.mk][reqNurse];save();break;
    case 'al':{const n=D().find(x=>x.id===t.dataset.id),k=+t.dataset.k;n.allow[t.dataset.r][t.dataset.s][k]=!n.allow[t.dataset.r][t.dataset.s][k];break}
    case 'addn':{const id='n'+Date.now().toString(36);D().push({id,name:'พยาบาลใหม่',nick:'',mode:'quota',quota:20,maxShifts:0,maxReg:0,maxSb:0,maxNight:0,allow:mkAllow(()=>[1,1])});openCards.add(id);break}
    case 'deln':{const n=D().find(x=>x.id===t.dataset.id);ask(`ลบ ${n.name} ออกจากรายชื่อ? (มีผลเมื่อกดบันทึก)`,'ลบพยาบาล',()=>{draft=D().filter(x=>x.id!==n.id);openCards.delete(n.id)});return}
    case 'ncancel':draft=null;toast('ยกเลิกการแก้ไขแล้ว');break;
    case 'nsave':saveNurses();return;
    case 'gasconn':gasConnect();return;
    case 'gasoff':gasOff();return;
    case 'backup':{const c2=ctx();saveFile(`สำรองข้อมูลจัดเวร_IPD_${c2.y+543}-${pad(c2.m+1)}.json`,JSON.stringify(S),'application/json');return}
    case 'up':{const N=D(),i=N.findIndex(x=>x.id===t.dataset.id);if(i>0)[N[i-1],N[i]]=[N[i],N[i-1]];break}
    case 'reset':ask('คืนค่าเริ่มต้นทั้งหมด? รายชื่อ เงื่อนไข คำขอ และตารางเวรทุกเดือนจะถูกลบ','คืนค่าเริ่มต้น',()=>{const old=[...Object.keys(S.requests),...Object.keys(S.rosters),...Object.keys(S.locks)];draft=null;S=defaults();old.forEach(m=>dirty.add(m));save()});return;
    case 'gm':{const g=S.groups[+t.dataset.g],id=t.dataset.id;g.members=g.members.includes(id)?g.members.filter(x=>x!==id):[...g.members,id];save();break}
    case 'gs':{const g=S.groups[+t.dataset.g],s=t.dataset.s;g.shifts=g.shifts.includes(s)?g.shifts.filter(x=>x!==s):[...g.shifts,s];save();break}
    case 'gdel':S.groups.splice(+t.dataset.g,1);save();break;
    case 'gadd':S.groups.push({members:[],shifts:['A','N'],sb:true});save();break;
    case 'hol':{const d=+t.dataset.d,k=`${c.y}-${pad(c.m+1)}-${pad(d)}`;S.holOverride[k]=!c.days[d-1].hol;save();break}
    default:return;
  }
  render();
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.nc'))d.open?openCards.add(d.dataset.id):openCards.delete(d.dataset.id)},true);
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f){setField(t);render();return}
  if(t.dataset.st){const [k,s,x]=t.dataset.st.split('.');S.staffing[k][s][x]=Math.max(0,+t.value||0);save();render();return}
  if(t.dataset.rule){const k=t.dataset.rule;S.rules[k]=t.type==='checkbox'?t.checked:(k==='quotaOrder'?t.value:(+t.value||0));save();render();return}
  if(t.dataset.gsb!=null){S.groups[+t.dataset.gsb].sb=t.checked;save();render();return}
});
document.addEventListener('change',e=>{const t=e.target;if(t.id!=='restore'||!t.files||!t.files[0])return;
  const f=t.files[0];t.value='';const rd=new FileReader();
  rd.onload=()=>{let o;try{o=JSON.parse(rd.result)}catch(err){toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองข้อมูลของโปรแกรม');return}
    if(!o||o.v!==3||!Array.isArray(o.nurses)){toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองข้อมูลของโปรแกรมฉบับนี้');return}
    ask(`นำเข้าข้อมูลจาก ${f.name}? ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่`,'นำเข้า',()=>{
      const old=[...Object.keys(S.requests),...Object.keys(S.rosters),...Object.keys(S.locks)];
      S=Object.assign(defaults(),o);draft=null;reqNurse=S.nurses[0]?.id;
      [...old,...Object.keys(S.requests),...Object.keys(S.rosters),...Object.keys(S.locks)].forEach(m=>dirty.add(m));save();toast('นำเข้าข้อมูลแล้ว')})};
  rd.readAsText(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').innerHTML=''});
render();
</script>
